spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/NotificationService
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.rahul.notification_service.event.TransferEvent
        spring.json.trusted.packages: "com.rahul.notification_service.event"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/