server:
  port: 8082

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:transaction-service-data.sql

#logging:
#  level:
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace

account-service:
  url: http://account-service

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        register-health-indicator: true       # exposes this CB's status on /actuator/health
        sliding-window-size: 10                # judges failure rate on the last 10 calls only
        minimum-number-of-calls: 5             # won't evaluate failure rate until 5 calls happened
        failure-rate-threshold: 50             # opens the circuit once >=50% of the window failed
        wait-duration-in-open-state: 10s       # stays OPEN this long before trying HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.rahul.transaction_service.exception.WalletNotFoundException
          - com.rahul.transaction_service.exception.InsufficientBalanceException

  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 500ms
        # Exponential backoff: instead of retrying every flat 500ms, the wait
        # grows between attempts - attempt 1 fails -> wait ~500ms -> attempt 2
        # fails -> wait ~500ms * 2 = ~1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
            - com.rahul.transaction_service.exception.WalletNotFoundException
            - com.rahul.transaction_service.exception.InsufficientBalanceException

  ratelimiter:
    instances:
      accountService:
        # Proactive, not reactive: caps outgoing calls before anything fails.
        # Max 10 calls/sec to Account Service, regardless of success/failure.
        limit-for-period: 10
        limit-refresh-period: 1s
        # 11th call waits up to 500ms for next window, else fails fast.
        timeout-duration: 500ms

  bulkhead:
     instances:
       accountService:
         max-concurrent-calls: 5   # at most 5 calls to Account Service in-flight at once
         max-wait-duration: 500ms  # a 6th call waits up to this long for a slot, then fails fast

